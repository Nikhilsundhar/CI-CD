name: Deploy to DEV

on:
  push:
    branches:
      - dev

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3

       - name: Deploy Changed SQL Files to DEV
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DEV_DATABASE }}
        run: |
          echo "Finding changed SQL files..."
          CHANGED_FILES=$(git diff --name-only \
            ${{ github.event.before }} \
            ${{ github.sha }} \
            | grep "^sql/.*\.sql$" || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No SQL files changed."
            exit 0
          fi

          for file in $CHANGED_FILES
          do
            DEPTH=$(echo "$file" | awk -F'/' '{print NF}')
            if [ "$DEPTH" -ne 5 ]; then
              echo "::error::$file does not match sql/<layer>/<schema>/<type>/<file>.sql"
              exit 1
            fi

            SCHEMA=$(echo "$file" | cut -d'/' -f3 | tr '[:lower:]' '[:upper:]')

            echo "--------------------------------------"
            echo "Deploying $file -> ${SNOWFLAKE_DATABASE}.${SCHEMA}"

            # Render placeholders ourselves -- don't rely on snow CLI templating
            sed -e "s/{{ *DATABASE *}}/${SNOWFLAKE_DATABASE}/g" \
                -e "s/{{ *SCHEMA *}}/${SCHEMA}/g" \
                "$file" > /tmp/rendered.sql

            snow sql \
              --temporary-connection \
              --enable-templating NONE \
              -f /tmp/rendered.sql
          done

          echo "DEV deployment completed."